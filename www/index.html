function mv(dx,dy){const r=13;for(const[ax,ay]of[[dx,0],[0,dy]]){const nx=G.px+ax,ny=G.py+ay;let hit=false;for(let cy=Math.floor((ny-r)/TS);cy<=Math.floor((ny+r)/TS);cy++)for(let cx=Math.floor((nx-r)/TS);cx<=Math.floor((nx+r)/TS);cx++)if(wall(cx,cy)){const qx=Math.max(cx*TS,Math.min(nx,cx*TS+TS)),qy=Math.max(cy*TS,Math.min(ny,cy*TS+TS));if(Math.hypot(nx-qx,ny-qy)<r)hit=true}if(!hit){G.px=nx;G.py=ny}}

const tx=G.px/TS|0,ty=G.py/TS|0;if(tx!=G.lx||ty!=G.ly){G.lx=tx;G.ly=ty;G.pd=bfs(tx,ty)}

x.drawImage(S.dl,0,0,34,112,-34,-124,34*k,112);x.drawImage(S.dr,0,0,34,112,34-34*k,-124,34*k,112);x.fillStyle=(G.found>=G.need&&!G.opening)?'#ffd24a':'rgba(255,40,40,'+(.6+.4*Math.sin(G.t*4))+')';x.beginPath();x.arc(0,-132,4.5,0,7);x.fill();x.restore()}
else if(e.k==2){const f=G.mvn?(Math.abs(Math.floor(G.t*8))%2):0,ax=Math.abs(G.fx),ay=Math.abs(G.fy),d=ax>ay?'s':(G.fy<0?'u':'d'),bob=G.mvn?Math.abs(Math.sin(G.t*14))*-2:Math.sin(G.t*3)*-.8,sp=SP.h[d][f];x.fillStyle='#0007';x.beginPath();x.ellipse(G.px,G.py+8,15,5,0,0,7);x.fill();x.save();x.translate(G.px,G.py+8+bob);if(d=='s'&&G.fx<0)x.scale(-1,1);x.drawImage(sp,-32,-96,64,100);x.restore()}
