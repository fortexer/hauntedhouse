name: Create signing key (run ONCE)

on: workflow_dispatch

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore ks.jks -alias key -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Fortexer, O=Fortexer, C=IR"
          base64 -w0 ks.jks > keystore_base64.txt
          echo -n "$PASS" > keystore_password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEEP-SECRET-keystore
          path: |
            ks.jks
            keystore_base64.txt
            keystore_password.txt
          retention-days: 1
